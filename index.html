<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lumiya Gold and Diamonds | Digital Visiting Card</title>
    <meta
      name="description"
      content="Lumiya Gold and Diamonds, Gold Souq, Deira, Dubai. Where luxury shines. Trust in every carat. Instant gold, instant cash. Connect on Instagram and WhatsApp, or find our location."
    />
    <meta name="theme-color" content="#230A07" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons: emblem on the brand's dark plate -->
    <link rel="icon" type="image/png" href="/images/favicon-64.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />

    <!-- Fonts: Cormorant Garamond (display) + Jost (small text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap"
    />

    <!-- Link preview (WhatsApp, iMessage, social). -->
    <!-- After deploying, change og:image to the full URL, e.g. https://your-domain.com/images/lumiya-icon.png -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumiya Gold and Diamonds" />
    <meta
      property="og:description"
      content="Where luxury shines. Gold Souq, Deira, Dubai."
    />
    <meta property="og:image" content="/images/lumiya-icon.png" />
    <meta name="twitter:card" content="summary" />

    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
